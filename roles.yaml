# Карта исполнителей (§16 дизайн-дока).
# executor: agent | human | hybrid | external
# token_slot: имя сервиса в macOS keychain (security find-generic-password -s <slot> -w).
#   Фаза 0: все слоты падают fallback'ом в общий 'artel-token' (см. ADR-0001).
#   Выход из Фазы 0: завести отдельные fine-grained PAT и положить в слоты —
#   код менять не нужно, только keychain.

roles:
  orchestrator:
    executor: system            # не LLM: FSM + журнал
    token_slot: artel-orchestrator
  analyst:
    executor: agent              # A5 (tasks/T025): SPEC из ТЗ Оператора;
                                  # без tasks/<id>/TZ.md — прежний флоу
                                  # (SPEC пишет Оператор, run отказывает
                                  # именованно)
    token_slot: artel-analyst
    skills: [conventions-core, escalation-rules, spec-authoring]
    model_tier: strong            # ярус -> модель: .artel/models.yaml (tiers)
  test_author:
    executor: agent              # A4 (tasks/T023): приёмочные тесты до кода
    token_slot: artel-test-author
    skills: [conventions-core, escalation-rules, test-authoring]
    model_tier: strong            # ярус -> модель: .artel/models.yaml (tiers)
  developer:
    executor: agent
    token_slot: artel-developer
    skills: [conventions-core, escalation-rules, coding-standards]
    model_tier: strong            # ярус -> модель: .artel/models.yaml (tiers)
  reviewer:
    executor: agent
    token_slot: artel-reviewer
    skills: [conventions-core, escalation-rules, review-checklist]
    model_tier: strong            # ярус -> модель: .artel/models.yaml (tiers)
  verifier:
    executor: none              # появится в MVP (стенд + приёмочные тесты)
    token_slot: artel-verifier

token_fallback: artel-token     # один ключ Фазы 0; удалить при разделении PAT
