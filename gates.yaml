# Политика гейтов (ADR-0007, SPEC T066). ДЕЙСТВУЕТ: читается
# `orchestrator/gates.py` (`policy()`) на переходе в `acceptance`
# (с ADR-0009 — из `verifying`, после зелёного CI ветки) — ТОЛЬКО
# из главной копии пульта (`config.ROOT`), никогда
# с ветки/worktree задачи. Меняет этот файл только Оператор отдельным MR
# (PROTECTED_PATHS, skills/conventions-core.md) — kill-switch автогейта
# любого гейта одной строкой: значение обратно на `manual`.
#
# Значение каждого гейта — буквально `auto` или `manual`. Дефолт при
# отсутствии ключа, неизвестном значении или нечитаемом файле — `manual`
# (fail-closed): молчание/поломка файла не читается как согласие.
#
# Имена гейтов — состояния FSM (`orchestrator/fsm.py`): spec_gate,
# acceptance, merge_gate. Только `acceptance` умеет автопроходить (ADR-0007
# п.3-5): условия — каталог приёмочных тестов задачи без manual/skip,
# зелёный прогон приёмочных задачи, зелёный полный набор `tests/` в
# worktree ветки, бюджет ЗАДАЧИ не исчерпан, вердикт REVIEW approved
# текущей итерации (пороги программы A1 исключены из условий —
# ADR-0010, исполняет T085; до её мержа код ещё проверяет их). `merge_gate` (ждёт детекторов
# деградации) и `spec_gate` (без горизонта автоматизации) автопути не
# получают ни при каком значении здесь — `orchestrator/fsm.py` читает
# политику только на переходе acceptance.
gates:
  spec_gate: manual
  acceptance: auto
  merge_gate: manual
