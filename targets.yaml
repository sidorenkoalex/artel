# Целевые проекты (ADR-0003 п.2). Читается кодом: orchestrator/targets.py.
# Формат — то подмножество YAML, которое разбирает orchestrator/yamlmini.py:
# вложенные отображения по отступу и потоковые списки [a, b].
#
# Поля записи:
#   forge           github | gitlab — семейство API целевого
#   url             адрес репозитория целевого
#   base            базовая ветка: от неё ветки задач, в неё merge
#   token_slot      имя слота в keychain (слоты — см. roles.yaml)
#   no_paths        пути целевого, которые задачам трогать нельзя
#   project_skills  курируемый список проектных скилов (ADR-0003 3з)
#   merge_gate      operator | target-human — кто исполняет гейт мержа (п.7)
#   knowledge       необязательно: файл проектных карточек знаний — у artel
#                   knowledge/<имя>.yaml, у внешнего проекта
#                   .artel/projects/<имя>/knowledge/<имя>.yaml
#
# Каталог target'а (.artel/projects/<имя>/) заводит команда
#   python3 orchestrator/artel.py target-init <имя>
#
# Первая запись — сам пульт: артель становится обычным внешним целевым
# после A7, до тех пор её артефакты живут в tasks/ пульта (ADR-0003 3д).

targets:
  artel:
    forge: github
    url: https://github.com/sidorenkoalex/artel
    base: main
    token_slot: artel-token
    # Пути, которые меняет только Оператор (CLAUDE.md, ADR-0001). У внешнего
    # проекта no_paths — перечень его защищённых путей, по нему сверяют
    # гейты пульта (orchestrator/repo_context.py::protected_paths). У artel
    # перечень пульта — config.PROTECTED_PATHS, а это поле — его зеркало:
    # совпадение держит сторож tests/test_01m45fk56dwmnbrka1vwm12h19_no_paths_mirror.py.
    # Зеркало внесено в main вперёд кода задачи 01M45FK56DWMNBRKA1VWM12H19
    # (решение Оператора 06.10, коммит 09256315).
    no_paths: [gates.yaml, roles.yaml, .github/, templates/, skills/, docs/invariants.md, tests/test_invariants.py, docs/adr/, CLAUDE.md, AGENTS.md, targets.yaml, models.yaml, model_sets.yaml, **/conftest.py, pyproject.toml, pytest.ini, setup.cfg, tox.ini, knowledge/]
    project_skills: []
    merge_gate: operator
    knowledge: knowledge/artel.yaml
    test_profile:
      command: [python3, -m, pytest]
      long_lived_dir: tests
      long_lived_name: test_<id>_<name>.py
      weakening_scope: [tests/**/*.py]
      mutation_claim_scope: [tests/test_*.py]
      report: junit-xml
      install: []
      full_suite_timeout_sec: 1500
    # Справочник ядра в брифе developer/test_author (SPEC
    # 01M4S24963R9H18AN2XDP6R15B, 01M4S24EBVB72B8WYJ3JY96Y0E): модули ядра и
    # константы, которые роль получает коротким ответом «как пользоваться»;
    # кэш — .artel/projects/artel/knowledge/derived/core-reference.md.
    core_reference:
      modules: [orchestrator/store.py, orchestrator/config.py, tests/sandbox.py, orchestrator/fsm.py, orchestrator/runner.py, orchestrator/gitcmd.py]
      constants_module: orchestrator/config.py
      constants: [PROTECTED_PATHS, COMMON_ZONES, STATE_ROLE, DEFAULT_TARGET, PROJECT_DIRS, MAIN_BRANCH, ROOT, TASKS, PROJECTS, TARGETS, DB, LOGS]
      # Порог использования (задача 01M4TVBT9Z, решение Оператора 13.10):
      # 4 даёт 26 432 байта против 30 386 при умолчании 3 (предел 32 768).
      min_uses: 4
