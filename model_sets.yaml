# Наборы моделей задач и допуск пар «роль — модель» (SPEC
# 01M3YCHP14179R32SFJVKQB32G; ADR-0019 п.5). Решения Оператора: файл
# защищён от ролей, правится `doc-commit`; запись пары пишет команда
# `artel.py admit` — она пересобирает файл, сохраняя только эту шапку.
#
# sets:              <имя набора>: <роль>: <id модели каталога>
# pairs:             <роль>: <id модели>: date / basis / state
#                    (допущена | приостановлена)
# canary_templates:  <title прогона канарейки>: быстрый | средний | трудный

sets:
  codex-dev:
    developer: gpt-6-sol
pairs:
  developer:
    gpt-6-sol:
      date: 2026-10-02
      basis: канарейка 30.09–02.10: 14 чистых прогонов на 6 шаблонах, из них на средних canary-status-sort, canary-log-tail, canary-usage-invariant; сводка admit 02.10
      state: допущена
canary_templates:
  canary-version-json: быстрый
  canary-log-filters: быстрый
  canary-status-sort: средний
  canary-log-tail: средний
  canary-usage-invariant: средний
  canary-budget-percent-ambiguous: трудный
