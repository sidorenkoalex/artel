name: ci

on:
  push:
    branches: ["main", "task/**"]
  pull_request:

jobs:
  guard:
    name: Валидация артефактов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard.py по всем артефактам задач
        run: |
          if ls tasks/*/*.md >/dev/null 2>&1; then
            python3 scripts/guard.py --all
          else
            echo "артефактов пока нет — ок"
          fi

  python:
    name: Синтаксис и тесты оркестратора
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile orchestrator/artel.py scripts/guard.py
      - name: unit-тесты (если появятся)
        run: |
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi

  protected-paths:
    name: Enforcement, конфиги системы меняет только Оператор
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: diff не трогает защищённые пути (кроме PR Оператора)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Фаза 0: один аккаунт => проверка деградирует до предупреждения.
          # При разделении токенов заменить exit 0 на exit 1 (см. ADR-0001).
          PROTECTED='^(gates\.yaml|roles\.yaml|\.github/|templates/|skills/|tests/test_invariants\.py|docs/invariants\.md)'
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E "$PROTECTED" || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::PR от $PR_AUTHOR меняет защищённые пути:"
            echo "$CHANGED"
            echo "Фаза 0 (один токен): warning. После разделения PAT — fail."
          fi

  codebase-map:
    name: Карта кодовой базы генерируется и свежа
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: генератор отрабатывает без ошибок (AC-7, AC-8)
        run: python3 scripts/codebase_map.py
      - name: закоммиченная карта не стухла (AC-9, ред. Оператора 25.08)
        run: |
          # Стухшая карта = изменения отображаемых модулей между
          # built_at_sha и head. Равенство sha невыполнимо структурно:
          # коммит, обновляющий карту, не несёт собственный sha
          # (ревью T027, итерация 1).
          base=$(git show HEAD:docs/codebase-map.md | sed -n 's/^built_at_sha: *//p' | head -1)
          if [ -z "$base" ]; then
            echo "в закоммиченной карте нет built_at_sha"
            exit 1
          fi
          stale=$(git diff --name-only "$base" HEAD -- 'orchestrator/*.py' 'scripts/*.py' 'tests/*.py')
          if [ -n "$stale" ]; then
            echo "карта стухла: модули менялись после built_at_sha=$base:"
            echo "$stale"
            exit 1
          fi
