name: ci

on:
  push:
    # "artifact/**" — артефактная ветка пульта задачи внешнего target'а
    # (SPEC T094, требование 7): guard обязан валидировать структуру
    # tasks/<id>/ и там же, не только на кодовых ветках self.
    branches: ["main", "task/**", "artifact/**"]
  pull_request:

jobs:
  guard:
    name: Валидация артефактов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: версия Python из манифеста стека (01M1RDCCKBQMJ5G2K9ANJP059H)
        id: stack-python
        run: echo "version=$(python3 scripts/stack_ci.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.stack-python.outputs.version }}
      - name: guard.py по всем артефактам задач
        run: |
          # Ветка task/** — не источник истины для tasks/<id>/ (SPEC
          # 01M1R9YEK08XEQWBFX0929WFVJ, требование 4/AC-9): роли коммитят
          # артефакты только в артефактную ветку (artifact/**), кодовая
          # ветка задачи несёт в лучшем случае устаревшую легаси-копию —
          # guard по ней красил CI на расхождении, которого в источнике
          # истины не было (SPEC «Контекст», 01M1PP0VYRT55WN8GGVG66X89Y).
          # Источник истины — свой собственный прогон на пуше artifact/**.
          if [[ "${GITHUB_REF#refs/heads/}" == task/* ]]; then
            echo "ветка task/** — tasks/<id>/ не источник истины здесь, источник — artifact/** (SPEC 01M1R9YEK08XEQWBFX0929WFVJ)"
            exit 0
          fi
          # На артефактной ветке пульта задачи (`artifact/<id>`) каждый
          # автокоммит шага роли несёт промежуточные, по определению
          # неполные артефакты (01M1R66X5SMD3ZEDCVAJ0DR7K2, требование 6):
          # `--artifact-branch` понижает нарушения содержания черновика
          # до предупреждения, оставляя нарушения frontmatter и полную
          # проверку «сданных» артефактов ошибкой. На `main` — вызов без
          # флага, поведение прежнее.
          GUARD_ARGS="--all"
          if [[ "${GITHUB_REF#refs/heads/}" == artifact/* ]]; then
            GUARD_ARGS="--all --artifact-branch"
          fi
          if ls tasks/*/*.md >/dev/null 2>&1; then
            python3 scripts/guard.py $GUARD_ARGS
          else
            echo "артефактов пока нет — ок"
          fi

  id-format-greplint:
    name: Линт — новый парсинг формата id задачи вне генератора
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: diff не добавляет парсинг формата id задачи вне orchestrator/idgen.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # SPEC T094, требование 4/AC-4: формат id задачи (ULID и легаси
          # Tnnn) обязана знать только orchestrator/idgen.py — остальной
          # код обращается с id как с непрозрачной строкой (требование 2).
          # Линт смотрит только НОВЫЕ строки дифа (тот же приём, что
          # protected-paths ниже) — существующий легаси-парсер
          # (orchestrator/store.py, TASK_ID, требование 6) не тронут этим
          # PR и линт его не видит.
          # Область — только *.py (правка Оператора 02.09): назначение
          # линта — «КОД не парсит формат id»; Markdown-артефакты задач
          # (PLAN/REVIEW/RETRO), цитирующие шаблон в прозе, давали
          # ложные срабатывания.
          #
          # Образцы — общий источник с проверкой перехода tests_writing ->
          # in_dev (SPEC 01M1H186VEVG6NF40YKH1338MD, требование 2/AC-3):
          # scripts/id_format_patterns.txt, не инлайн-паттерн здесь —
          # правка файла меняет обе проверки без правки этого job'а.
          ADDED=$(git diff "$BASE_SHA"...HEAD -- '*.py' ':!orchestrator/idgen.py' \
            | grep -E '^\+' | grep -Ev '^\+\+\+' | grep -Ef scripts/id_format_patterns.txt || true)
          if [ -n "$ADDED" ]; then
            echo "::error::диф добавляет парсинг формата id задачи вне orchestrator/idgen.py (SPEC T094, требование 4):"
            echo "$ADDED"
            exit 1
          fi

  canary-guid-leak:
    name: Линт — GUID канареечного пула не протекает в промпты ролей
    # Мержи пульта идут пушем в main без pull request (merge_gate ->
    # done), поэтому сторож работает и на push: база — sha до пуша
    # (`github.event.before`); для новой ветки она нулевая — пропуск.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: diff не добавляет отметку canary-guid в skills/, templates/, docs/
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "базы для диффа нет (новая ветка или принудительный пуш) — пропуск"
            exit 0
          fi
          # SPEC 01M1NEEWH5K1XPFRDGRMPYSBXJ, требование 7/AC-7: каждый
          # шаблон пула несёт машиночитаемую метку `canary-guid:` (см.
          # orchestrator/canary.py, модульный докстринг) — сама метка НЕ
          # существует нигде в коде пульта (пул живёт вне git), так что
          # её появление в skills/, templates/ или docs/ пульта
          # однозначно означает утечку контекста роли в пул (требование
          # 13). Список конкретных GUID не нужен — паттерн общий.
          ADDED=$(git diff "$BASE_SHA"...HEAD -- 'skills/*' 'templates/*' 'docs/*' \
            | grep -E '^\+' | grep -Ev '^\+\+\+' | grep -Ei 'canary-guid:' || true)
          if [ -n "$ADDED" ]; then
            echo "::error::диф добавляет отметку canary-guid в skills/, templates/ или docs/ — утечка пула канарейки (SPEC 01M1NEEWH5K1XPFRDGRMPYSBXJ, требование 7):"
            echo "$ADDED"
            exit 1
          fi
      - name: diff не добавляет значение GUID запечатанного пула в skills/, templates/, docs/
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "базы для диффа нет (новая ветка или принудительный пуш) — пропуск"
            exit 0
          fi
          # SPEC 01M1NSR5M5THYRC0RFWPMVE2DW, требование 4/6: манифест
          # canary/guids.txt — открытый список GUID запечатанного пула
          # (ключа расшифровки в CI нет и не нужен — сравнение по
          # значениям GUID, не по содержимому шаблонов). Появление
          # любого значения манифеста в skills/, templates/ или docs/
          # пульта — та же утечка контекста роли в пул, что и общий
          # маркер canary-guid: выше, только по конкретному значению.
          if [ ! -f canary/guids.txt ] || [ ! -s canary/guids.txt ]; then
            echo "canary/guids.txt ещё нет или пуст — пропуск (пул ещё не запечатан)"
            exit 0
          fi
          ADDED=$(git diff "$BASE_SHA"...HEAD -- 'skills/*' 'templates/*' 'docs/*' \
            | grep -E '^\+' | grep -Ev '^\+\+\+' \
            | grep -Ff <(grep -v '^[[:space:]]*$' canary/guids.txt) || true)
          if [ -n "$ADDED" ]; then
            echo "::error::диф добавляет значение GUID запечатанного пула канарейки в skills/, templates/ или docs/ — утечка (SPEC 01M1NSR5M5THYRC0RFWPMVE2DW, требование 4):"
            echo "$ADDED"
            exit 1
          fi

  python:
    name: Синтаксис и тесты оркестратора
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: версия Python из манифеста стека (01M1RDCCKBQMJ5G2K9ANJP059H)
        id: stack-python
        run: echo "version=$(python3 scripts/stack_ci.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.stack-python.outputs.version }}
      - run: python3 -m py_compile orchestrator/artel.py scripts/guard.py
      - name: снимок ссылок репозитория до прогона тестов (SPEC 01M1KVGD18P9H5WR7VM8TGPV1T, требование 1)
        run: git for-each-ref --format='%(refname) %(objectname)' refs/heads/ refs/artifacts/ > /tmp/refs-before.txt
      - name: unit-тесты (если появятся)
        run: |
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
      - name: прогон tests/ не меняет набор ссылок репозитория (SPEC 01M1KVGD18P9H5WR7VM8TGPV1T, требование 1)
        run: |
          # Инвариант: полный прогон tests/ не пишет в объектную базу CI-
          # чекаута (единая точка подмены gitcmd.carpentry — tests/sandbox.py
          # ::TmpRootTest патчит её по умолчанию для всех наследников).
          # Раньше тест, заводивший задачу через cmd_new без подмены
          # config.ROOT, коммитил артефактную ветку прямиком в этот же
          # чекаут (SPEC 01M1KVGD18P9H5WR7VM8TGPV1T, «Контекст»).
          git for-each-ref --format='%(refname) %(objectname)' refs/heads/ refs/artifacts/ > /tmp/refs-after.txt
          if ! diff -u /tmp/refs-before.txt /tmp/refs-after.txt; then
            echo "::error::прогон tests/ изменил набор ссылок репозитория — см. diff выше"
            exit 1
          fi
      - name: минимальная версия Python из манифеста (01M1RDCCKBQMJ5G2K9ANJP059H, требование 2)
        id: stack-python-min
        run: echo "version=$(python3 scripts/stack_ci.py --min)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.stack-python-min.outputs.version }}
      - name: tests.test_invariants на минимальной объявленной версии Python (AC-2)
        run: python3 -m unittest tests.test_invariants -v

  protected-paths:
    name: Enforcement, конфиги системы меняет только Оператор
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: diff не трогает защищённые пути (кроме PR Оператора)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Фаза 0: один аккаунт => проверка деградирует до предупреждения.
          # При разделении токенов заменить exit 0 на exit 1 (см. ADR-0001).
          PROTECTED='^(gates\.yaml|roles\.yaml|targets\.yaml|CLAUDE\.md|\.github/|templates/|skills/|tests/test_invariants\.py|docs/invariants\.md)'
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E "$PROTECTED" || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::PR от $PR_AUTHOR меняет защищённые пути:"
            echo "$CHANGED"
            echo "Фаза 0 (один токен): warning. После разделения PAT — fail."
          fi

  codebase-map:
    name: Карта кодовой базы генерируется и свежа
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: версия Python из манифеста стека (01M1RDCCKBQMJ5G2K9ANJP059H)
        id: stack-python
        run: echo "version=$(python3 scripts/stack_ci.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.stack-python.outputs.version }}
      - name: генератор отрабатывает без ошибок (AC-7, AC-8)
        run: python3 scripts/codebase_map.py
      - name: закоммиченная карта не стухла (AC-9; ред. Оператора 26.08 — сверка содержимым)
        run: |
          # Ред. Оператора 26.08 (наблюдение ревью T034): дифф-сверка
          # по built_at_sha структурно красит main, когда .py-правка
          # и регенерация карты в одном коммите (built_at_sha не может
          # нести sha собственного коммита) — с мержа T031 main был
          # красным. Сверка содержимым: шаг 1 уже перегенерировал карту
          # из текущих исходников — закоммиченная свежа тогда и только
          # тогда, когда совпадает с перегенерированной (кроме строки
          # built_at_sha). Дифф модулей и exit 1 ниже — прежний контракт
          # AC-9 (T027) в новой механике: git diff --name-only печатает
          # расхождение файла карты, не путей .py.
          if ! git diff --name-only --exit-code -- docs/codebase-map.md >/dev/null; then
            base=$(git show HEAD:docs/codebase-map.md | sed -n 's/^built_at_sha: *//p' | head -1)
            if git show HEAD:docs/codebase-map.md | grep -v '^built_at_sha:' | diff -q - <(grep -v '^built_at_sha:' docs/codebase-map.md) >/dev/null; then
              echo "карта свежа: содержимое совпадает, отличается только built_at_sha ($base)"
            else
              echo "карта стухла: закоммиченная отличается от перегенерированной (built_at_sha=$base):"
              git show HEAD:docs/codebase-map.md | grep -v '^built_at_sha:' | diff - <(grep -v '^built_at_sha:' docs/codebase-map.md) | head -20
              exit 1
            fi
          fi
