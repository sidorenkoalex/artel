name: ci

on:
  push:
    # "artifact/**" — артефактная ветка пульта задачи внешнего target'а
    # (SPEC T094, требование 7): guard обязан валидировать структуру
    # tasks/<id>/ и там же, не только на кодовых ветках self.
    branches: ["main", "task/**", "artifact/**"]
  pull_request:

jobs:
  guard:
    name: Валидация артефактов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard.py по всем артефактам задач
        run: |
          if ls tasks/*/*.md >/dev/null 2>&1; then
            python3 scripts/guard.py --all
          else
            echo "артефактов пока нет — ок"
          fi

  id-format-greplint:
    name: Линт — новый парсинг формата id задачи вне генератора
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: diff не добавляет парсинг формата id задачи вне orchestrator/idgen.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # SPEC T094, требование 4/AC-4: формат id задачи (ULID и легаси
          # Tnnn) обязана знать только orchestrator/idgen.py — остальной
          # код обращается с id как с непрозрачной строкой (требование 2).
          # Линт смотрит только НОВЫЕ строки дифа (тот же приём, что
          # protected-paths ниже) — существующий легаси-парсер
          # (orchestrator/store.py, TASK_ID, требование 6) не тронут этим
          # PR и линт его не видит.
          # Область — только *.py (правка Оператора 02.09): назначение
          # линта — «КОД не парсит формат id»; Markdown-артефакты задач
          # (PLAN/REVIEW/RETRO), цитирующие шаблон в прозе, давали
          # ложные срабатывания.
          #
          # Образцы — общий источник с проверкой перехода tests_writing ->
          # in_dev (SPEC 01M1H186VEVG6NF40YKH1338MD, требование 2/AC-3):
          # scripts/id_format_patterns.txt, не инлайн-паттерн здесь —
          # правка файла меняет обе проверки без правки этого job'а.
          ADDED=$(git diff "$BASE_SHA"...HEAD -- '*.py' ':!orchestrator/idgen.py' \
            | grep -E '^\+' | grep -Ev '^\+\+\+' | grep -Ef scripts/id_format_patterns.txt || true)
          if [ -n "$ADDED" ]; then
            echo "::error::диф добавляет парсинг формата id задачи вне orchestrator/idgen.py (SPEC T094, требование 4):"
            echo "$ADDED"
            exit 1
          fi

  python:
    name: Синтаксис и тесты оркестратора
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile orchestrator/artel.py scripts/guard.py
      - name: unit-тесты (если появятся)
        run: |
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi

  protected-paths:
    name: Enforcement, конфиги системы меняет только Оператор
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: diff не трогает защищённые пути (кроме PR Оператора)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Фаза 0: один аккаунт => проверка деградирует до предупреждения.
          # При разделении токенов заменить exit 0 на exit 1 (см. ADR-0001).
          PROTECTED='^(gates\.yaml|roles\.yaml|targets\.yaml|CLAUDE\.md|\.github/|templates/|skills/|tests/test_invariants\.py|docs/invariants\.md)'
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E "$PROTECTED" || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::PR от $PR_AUTHOR меняет защищённые пути:"
            echo "$CHANGED"
            echo "Фаза 0 (один токен): warning. После разделения PAT — fail."
          fi

  codebase-map:
    name: Карта кодовой базы генерируется и свежа
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: генератор отрабатывает без ошибок (AC-7, AC-8)
        run: python3 scripts/codebase_map.py
      - name: закоммиченная карта не стухла (AC-9; ред. Оператора 26.08 — сверка содержимым)
        run: |
          # Ред. Оператора 26.08 (наблюдение ревью T034): дифф-сверка
          # по built_at_sha структурно красит main, когда .py-правка
          # и регенерация карты в одном коммите (built_at_sha не может
          # нести sha собственного коммита) — с мержа T031 main был
          # красным. Сверка содержимым: шаг 1 уже перегенерировал карту
          # из текущих исходников — закоммиченная свежа тогда и только
          # тогда, когда совпадает с перегенерированной (кроме строки
          # built_at_sha). Дифф модулей и exit 1 ниже — прежний контракт
          # AC-9 (T027) в новой механике: git diff --name-only печатает
          # расхождение файла карты, не путей .py.
          if ! git diff --name-only --exit-code -- docs/codebase-map.md >/dev/null; then
            base=$(git show HEAD:docs/codebase-map.md | sed -n 's/^built_at_sha: *//p' | head -1)
            if git show HEAD:docs/codebase-map.md | grep -v '^built_at_sha:' | diff -q - <(grep -v '^built_at_sha:' docs/codebase-map.md) >/dev/null; then
              echo "карта свежа: содержимое совпадает, отличается только built_at_sha ($base)"
            else
              echo "карта стухла: закоммиченная отличается от перегенерированной (built_at_sha=$base):"
              git show HEAD:docs/codebase-map.md | grep -v '^built_at_sha:' | diff - <(grep -v '^built_at_sha:' docs/codebase-map.md) | head -20
              exit 1
            fi
          fi
