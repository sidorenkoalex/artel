# Курируемый конфиг Codex CLI для роли конвейера (НЕ конфиг Оператора).
#
# Этот файл — часть референса docs/reference/role-home/ репозитория
# пульта: `init` разворачивает каталог codex/ референса в
# .artel/home/.codex/ при холодном старте (только когда .artel/home ещё
# нет целиком), и туда же смотрит CODEX_HOME процесса роли
# (orchestrator/providers/codex.py). Правится он как обычный файл
# репозитория, под ревью кода; `doctor` сверяет развёрнутый слой с этим
# референсом и жёлтой строкой называет расхождение — в том числе на
# пульте, где дом роли создался пустым мимо развёртывания (порядок
# доведения — docs/stack.md, раздел «Провайдер codex»).
#
# Модель здесь НЕ задаётся намеренно: её выбирает ярус локального слоя
# пульта (.artel/models.yaml) и передаёт флагом `-m` сама команда шага.
# Ключ выбора модели в этом файле молча перебивал бы выбор пульта.
#
# MCP-серверов здесь нет и не должно быть: живой запуск 0.155.1 с
# пользовательским конфигом Оператора позвал MCP-сервер cua_repl
# («Computer Use») и попытался открыть браузер на машине Оператора.
#
# Каждое значение ниже дублируется флагом команды шага
# (orchestrator/providers/codex.py: CONFIG_OVERRIDES, DISABLED_FEATURES).
# Это не избыточность: .artel/home эфемерен (ADR-0005 п.3) и курируется
# руками, а команду шага собирает код — совпадение обеих половин
# сверяется тестом, а не глазом.

# Политика подтверждений: роль исполняется headless, спрашивать некого.
approval_policy = "never"

[sandbox_workspace_write]
# Сеть песочницы выключена: шаг роли работает с рабочей копией задачи,
# а всё сетевое (git push, gh) идёт объявленными инструментами пульта.
network_access = false

[features]
# Одиннадцать функций, включённых в 0.155.1 по умолчанию. Выключены все,
# включая hooks: аналогом bash_guard их не делаем — хук, включённый ради
# запрета, сам становится исполняемым кодом в доме роли, а границы
# рабочего каталога и паритет безопасности держит отдельная задача линии.
apps = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
in_app_browser = false
plugins = false
remote_plugin = false
plugin_sharing = false
skill_mcp_dependency_install = false
hooks = false
